# Test build of the Android app (no signing, nothing published): run by hand to check it compiles.
name: Android check

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: |
          npm ci --ignore-scripts
          cd mobile
          npm ci
          node build-www.js
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/
