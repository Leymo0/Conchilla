# Builds the Windows installer and publishes a GitHub release.
# Conchilla's "Check for updates" button downloads updates from these releases.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The app-only sound recorder (Windows process-loopback capture)
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build conchilla-audio.exe and conchilla-keys.exe
        shell: cmd
        run: |
          mkdir native\bin
          cl /nologo /O2 /EHsc /MT /std:c++17 /DUNICODE /D_UNICODE native\conchilla-audio.cpp /Fe:native\bin\conchilla-audio.exe /Fo:%RUNNER_TEMP%\ ole32.lib user32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /EHsc /MT /std:c++17 /DUNICODE /D_UNICODE native\conchilla-keys.cpp /Fe:native\bin\conchilla-keys.exe /Fo:%RUNNER_TEMP%\ user32.lib
          if errorlevel 1 exit /b 1
      - name: Check conchilla-audio.exe runs
        shell: pwsh
        run: |
          $p = Start-Process native/bin/conchilla-audio.exe -NoNewWindow -PassThru -Wait -RedirectStandardError "$env:RUNNER_TEMP/usage.txt"
          if ($p.ExitCode -ne 2) { Write-Output "::error title=Audio helper broken::exit $($p.ExitCode)"; exit 1 }
          Get-Content "$env:RUNNER_TEMP/usage.txt"
          $k = Start-Process native/bin/conchilla-keys.exe -NoNewWindow -PassThru -Wait
          if ($k.ExitCode -ne 2) { Write-Output "::error title=Keys helper broken::exit $($k.ExitCode)"; exit 1 }
          # the keyboard hook must install (it then exits here because nothing is attached to its input)
          $k = Start-Process native/bin/conchilla-keys.exe -ArgumentList "RShift" -NoNewWindow -PassThru -RedirectStandardError "$env:RUNNER_TEMP/keys.txt"
          Start-Sleep -Seconds 3
          if (-not $k.HasExited) { Stop-Process -Id $k.Id -Force }
          $keysOut = Get-Content "$env:RUNNER_TEMP/keys.txt" -Raw
          if ($keysOut -notmatch 'READY') { Write-Output "::error title=Keyboard hook failed::$keysOut"; exit 1 }
          Write-Host "keys helper: $keysOut"
          # Try a real capture of this shell's own audio (the build machine may have no sound device: info only)
          $q = Start-Process native/bin/conchilla-audio.exe -ArgumentList "exclude", "$PID" -NoNewWindow -PassThru -RedirectStandardError "$env:RUNNER_TEMP/try.txt" -RedirectStandardOutput "$env:RUNNER_TEMP/pcm.raw"
          Start-Sleep -Seconds 3
          if (-not $q.HasExited) { Stop-Process -Id $q.Id -Force }
          Write-Host "capture attempt: $(Get-Content "$env:RUNNER_TEMP/try.txt" -Raw) bytes=$((Get-Item "$env:RUNNER_TEMP/pcm.raw").Length)"

      - name: Check Windows process helpers
        shell: pwsh
        run: |
          node -e "const w=require('./win32'); const l=w.processList(); console.log('processes:', l.length, 'example:', JSON.stringify(l.find(p=>/node/i.test(p.exe)))); if(l.length<5) process.exit(1); console.log('discord pid:', w.discordPid())"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Process list broken::"; exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          # Log goes OUTSIDE the project folder: a file growing while the app is packed corrupts the package
          $log = Join-Path $env:RUNNER_TEMP 'build.log'
          npx electron-builder --win nsis --x64 --publish never 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content $log -Tail 20) -join ' || '
            Write-Output "::error title=Build failed::$tail"
            exit 1
          }

      # Never publish a broken app: read every file back out of the packed app and check it
      - name: Verify the packed app
        shell: pwsh
        run: |
          $out = node scripts/verify-asar.js dist/win-unpacked/resources/app.asar 2>&1
          Write-Host ($out -join "`n")
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Packed app is broken::$($out -join ' || ')"; exit 1 }
          if (-not (Test-Path dist/win-unpacked/resources/bin/conchilla-keys.exe)) {
            Write-Output "::error title=Missing keys helper::conchilla-keys.exe not packed"; exit 1
          }
          if (-not (Test-Path dist/win-unpacked/resources/bin/conchilla-audio.exe)) {
            Write-Output "::error title=Missing audio helper::conchilla-audio.exe not packed"; exit 1
          }
          if (-not (Test-Path dist/win-unpacked/resources/app.asar.unpacked/node_modules/koffi/build/koffi/win32_x64/koffi.node)) {
            Write-Output "::error title=Missing focus helper::koffi.node was not unpacked"; exit 1
          }

      # Start the packed app for a few seconds: it must not crash on launch
      - name: Smoke test
        shell: pwsh
        run: |
          $env:CONCHILLA_PROFILE = Join-Path $env:RUNNER_TEMP 'smoke'
          $p = Start-Process -FilePath dist/win-unpacked/Conchilla.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Output "::error title=App crashed on start::exit code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "App started fine"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          Write-Host "Publishing v$version with: $($files -join ', ')"
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) {
            $out = gh release upload "v$version" @files --clobber 2>&1
            if ($LASTEXITCODE -eq 0) { $out += gh release edit "v$version" --notes-file build/release-notes.md --title "Conchilla $version" 2>&1 }
          } else {
            $out = gh release create "v$version" @files --title "Conchilla $version" --notes-file build/release-notes.md --target $env:GITHUB_SHA 2>&1
          }
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Publish failed::$($out -join ' || ')"; exit 1 }
          Write-Host $out
