<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Conchilla Chat</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="root">
    <div id="calls"></div>
    <div id="composer" hidden>
      <ul id="history"></ul>
      <form id="compose-form">
        <div id="me-face"></div>
        <div class="compose-body">
          <label><span id="me-name">You</span> <span class="hint">Enter send · Esc cancel</span></label>
          <input id="compose" maxlength="300" autocomplete="off" spellcheck="false" placeholder="Type to your group…">
        </div>
      </form>
    </div>
    <div id="quick" hidden>
      <div class="q-head"><span class="dot"></span>STREAM <b>QUICK MENU</b><span class="hint">Esc / F8 closes</span></div>
      <div id="q-status" class="q-status"></div>
      <div class="q-grid">
        <label>Resolution<select data-q="resolution"></select></label>
        <label>Frame rate<select data-q="fps"></select></label>
        <label class="wide">Bitrate <b id="q-bitrate-label"></b><input type="range" data-q="bitrate" min="0" max="50" step="0.5"></label>
        <label>Content<select data-q="content"></select></label>
        <label>Codec<select data-q="codec"></select></label>
        <label class="wide">Sound from<select data-q="soundfrom"></select></label>
        <label class="wide">Sound<select data-q="audio"></select></label>
      </div>
      <button id="q-stream" type="button"></button>
    </div>
    <div id="move-frame" hidden><div>DRAG ME<br><small>then click “Done moving” in Conchilla</small></div></div>
  </div>
<script src="faces.js"></script>
<script src="overlay.js"></script>
</body>
</html>
